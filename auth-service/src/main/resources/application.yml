spring:
  application:
    name: auth-service
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: ${SPOTIFY_CLIENT_ID}
            client-secret: ${SPOTIFY_CLIENT_SECRET}
            redirect-uri: http://127.0.0.1:8081/auth/spotify/callback
            authorization-grant-type: authorization_code
            scope:
              - user-read-private
              - user-read-email
              - user-top-read
              - user-read-recently-played
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.wrapitup: DEBUG