server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: auth-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.wrapitup.*
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: ${SPOTIFY_CLIENT_ID}
            client-secret: ${SPOTIFY_CLIENT_SECRET}
            # This exact URI must also be registered in the Spotify developer
            # dashboard. The UI uses the same canonical host so the OAuth state
            # cookie is available when Spotify sends the callback.
            redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/auth/spotify/callback}
            authorization-grant-type: authorization_code
            scope:
              - user-read-private
              - user-read-email
              - user-top-read
              - user-read-recently-played
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me
            user-name-attribute: id

auth:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:local-development-only}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.wrapitup: DEBUG
    org.springframework.security: DEBUG
