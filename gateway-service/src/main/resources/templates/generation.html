<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Your wrap is taking shape')}"></head><body class="center-page generation-page"><main class="generation-card shell-card"><div class="loader" aria-label="Loading"></div><p class="eyebrow">your wrap is taking shape</p><h1>Finding the<br><em>through-line.</em></h1><p id="generation-message">We’re reading between the beats. This usually takes less than a minute.</p><div class="generation-id"><span>GENERATION ID</span><code th:text="${generationId}" id="generation-id">generation-id</code></div><a class="text-link back-link" href="/">← Back home</a></main><script th:inline="javascript">const generationId = /*[[${generationId}]]*/ '';let attempts = 0;const message = document.getElementById('generation-message'), loader = document.querySelector('.loader');function poll(){fetch(`/wraps/${generationId}/status`).then(r=>{if(!r.ok)throw new Error('status');return r.json()}).then(data=>{if(data.status==='COMPLETED'){window.location.href=`/wraps/${generationId}`;return}if(data.status==='FAILED'){loader.classList.add('stopped');message.textContent=data.message||'Something went wrong. Please try again.';return}if(++attempts<300){setTimeout(poll,1000)}else{loader.classList.add('stopped');message.textContent='This is taking longer than expected. Please refresh to try again.'}}).catch(()=>{if(++attempts<300)setTimeout(poll,1000);else{loader.classList.add('stopped');message.textContent='We could not check the generation. Please refresh to try again.'}})}poll();</script></body></html>
