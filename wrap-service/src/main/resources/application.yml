spring:
  application:
    name: wrap-service

  # Kafka configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      bootstrap-servers: localhost:9092
      group-id: wrap-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: |
          wrapAnalysisCompleted:com.wrapitup.common.event.payload.WrapAnalysisCompletedPayload,
          wrapGenerationFailed:com.wrapitup.common.event.payload.WrapGenerationFailedPayload
        spring.json.trusted.packages: '*'
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

  # Redis configuration for caching completed wraps
  redis:
    host: localhost
    port: 6379
    timeout: 2000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

server:
  port: 8084
  servlet:
    context-path: /

# Wrap service specific configuration
wrap:
  cache:
    ttl-minutes: 15  # Cache completed wraps for 15 minutes

logging:
  level:
    com.wrapitup: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"